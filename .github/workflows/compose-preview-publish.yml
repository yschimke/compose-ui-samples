name: Compose Preview Publish

# The privileged half of compose-preview.yml: takes the PR render's handoff and pushes it to the -out
# repository, then posts the before/after comment. Runs from the default branch's copy of this file
# (`workflow_run`), so a PR cannot change what runs with the token.

on:
  workflow_run:
    workflows: [Compose Preview]
    types: [completed]

permissions:
  actions: read
  # Read-only: renders are pushed to the -out repository with ARTIFACTS_TOKEN, not GITHUB_TOKEN.
  contents: read
  pull-requests: write

jobs:
  publish:
    if: github.event.workflow_run.event == 'pull_request' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v8.0.2
        with:
          name: compose-preview-handoff
          path: _compose_preview_handoff
          run-id: ${{ github.event.workflow_run.id }}
          # `run-id` is ignored without a token: the action then looks in THIS run and fails with
          # "Artifact not found".
          github-token: ${{ github.token }}
      - id: pr
        # The handoff comes from the PR's run, so keep only digits before writing an output; the
        # apply action still checks the number against the workflow_run head.
        run: echo "number=$(tr -cd 0-9 < _compose_preview_handoff/_pr_number)" >> "$GITHUB_OUTPUT"
      - uses: yschimke/compose-ai-tools/.github/actions/apply@v2.87.0
        with:
          phase: publish
          pr-number: ${{ steps.pr.outputs.number }}
          artifact-repository: yschimke/compose-ui-samples-out
          artifacts-token: ${{ secrets.ARTIFACTS_TOKEN }}
